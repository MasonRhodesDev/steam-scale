name: Release

# rpm: false skips COPR; the .deb and .rpm come from deb-rpm.yml instead. ARCH_REPO_TOKEN republishes [mason] on tag.
# tag.yml starts this on the tag it creates. A tag pushed by hand starts it too.
# version-from-tag makes the tag the package version.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/release.yml@v1
    secrets: inherit
    with:
      rpm: false
      version-from-tag: true

  deb-rpm:
    needs: release
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/deb-rpm.yml
    with:
      release-tag: ${{ github.ref_name }}
