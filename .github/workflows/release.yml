name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/release.yml@v1
    secrets: inherit
    with:
      rpm: false
      version-from-tag: true

  deb-rpm:
    needs: release
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/deb-rpm.yml
    with:
      release-tag: ${{ github.ref_name }}
