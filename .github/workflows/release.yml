name: Release

# rpm: false skips COPR. ARCH_REPO_TOKEN republishes [mason] on tag.
# tag.yml starts this on the tag it creates. A tag pushed by hand starts it too.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/release.yml@v1
    secrets: inherit
    with:
      rpm: false
