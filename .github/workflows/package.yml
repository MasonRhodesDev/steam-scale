name: Package

# Builds every package on each push and pull request. x86_64 only, the one
# architecture Steam ships for.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/arch-package.yml@v1

  deb-rpm:
    uses: ./.github/workflows/deb-rpm.yml
