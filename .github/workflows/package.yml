name: Package

# Arch only. The PKGBUILD's arch=() keeps this to x86_64, the only
# architecture Steam ships for.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/arch-package.yml@v1
